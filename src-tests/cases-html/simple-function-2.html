<!DOCTYPE html>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="sample.css">
<link rel="stylesheet" type="text/css" href="sample.css">
<span class="root">
	<span class="stable-function">
		<span class="token entity-token">foo</span>
		<span class="Enclosure.paren">
			<span class="token">(</span>
			<span class="token">)</span>
		</span>
		<span class="Enclosure.paren">
			<span class="token">(</span>
			<span class="simple-assignment">
				<span class="token entity-token">result1</span>
				<span class="token assigners basic-assign">=</span>
				<span class="each">
					<span class="infixed-chain">
						<span class="token integer-token">1</span>
						<span class="infixed-particle">
							<span class="token operators overloadable add">+</span>
							<span class="token integer-token">1</span>
						</span>
					</span>
					<span class="token suffixes each">each</span>
					<span class="token entity-token">num1</span>
					<span class="Enclosure.paren">
						<span class="token">(</span>
						<span class="expression-statement">
							<span class="compound-particle">
								<span class="origin-particle">
									<span class="token entity-token">console</span>
								</span>
								<span class="post-particle">
									<span class="token symbols dot">.</span>
									<span class="token entity-token">log</span>
									<span class="function-activator">
										<span class="token entity-token">num1</span>
									</span>
								</span>
							</span>
						</span>
						<span class="token">)</span>
					</span>
				</span>
			</span>
			<span class="simple-assignment">
				<span class="token entity-token">result2</span>
				<span class="token assigners basic-assign">=</span>
				<span class="each">
					<span class="infixed-chain">
						<span class="token integer-token">2</span>
						<span class="infixed-particle">
							<span class="token operators overloadable add">+</span>
							<span class="token integer-token">2</span>
						</span>
					</span>
					<span class="token suffixes each">each</span>
					<span class="token entity-token">num2</span>
					<span class="Enclosure.paren">
						<span class="token">(</span>
						<span class="expression-statement">
							<span class="compound-particle">
								<span class="origin-particle">
									<span class="token entity-token">console</span>
								</span>
								<span class="post-particle">
									<span class="token symbols dot">.</span>
									<span class="token entity-token">log</span>
									<span class="function-activator">
										<span class="token entity-token">num2</span>
									</span>
								</span>
							</span>
						</span>
						<span class="token">)</span>
					</span>
				</span>
			</span>
			<span class="token">)</span>
		</span>
	</span>
</span>
