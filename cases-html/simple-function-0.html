<!DOCTYPE html>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="sample.css">
<link rel="stylesheet" type="text/css" href="sample.css">
<span class="root">
	<span class="stable-function">
		<span class="token entity-token">fun</span>
		<span class="Enclosure.paren">
			<span class="token">(</span>
			<span class="token">)</span>
		</span>
		<span class="Enclosure.paren">
			<span class="token">(</span>
			<span class="simple-assignment">
				<span class="token entity-token">a</span>
				<span class="token assigners basic-assign">=</span>
				<span class="infixed-chain">
					<span class="origin-particle">
						<span class="token entity-token">b</span>
					</span>
					<span class="infixed-particle">
						<span class="token operators overloadable add">+</span>
						<span class="origin-particle">
							<span class="token entity-token">c</span>
						</span>
					</span>
				</span>
			</span>
			<span class="simple-assignment">
				<span class="token entity-token">x</span>
				<span class="token assigners basic-assign">=</span>
				<span class="infixed-chain">
					<span class="origin-particle">
						<span class="token entity-token">y</span>
					</span>
					<span class="infixed-particle">
						<span class="token operators overloadable add">+</span>
						<span class="origin-particle">
							<span class="token entity-token">z</span>
						</span>
					</span>
				</span>
			</span>
			<span class="token">)</span>
		</span>
	</span>
</span>
